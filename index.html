<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPS | Acesso ao Sistema</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs (Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyASwLb54IjFjpYoqVacuoVuOj_5LPPTrew",
      authDomain: "tatipannocchiajur.firebaseapp.com",
      projectId: "tatipannocchiajur",
      storageBucket: "tatipannocchiajur.firebasestorage.app",
      messagingSenderId: "442550623929",
      appId: "1:442550623929:web:361c33d8af02e055a0c568",
      measurementId: "G-E9XPJ50325"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleLogin = async function(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const senha = document.getElementById('loginSenha').value;
      const errorMsg = document.getElementById('errorMessage');
      const btnText = document.getElementById('btnText');
      const btnLoader = document.getElementById('btnLoader');

      try {
        errorMsg.classList.add('hidden');
        btnText.innerText = 'A entrar...';
        btnLoader.classList.remove('hidden');

        // Autenticar com o Firebase Auth
        await signInWithEmailAndPassword(auth, email, senha);

        // Sucesso: Redireciona para o painel principal (app.html)
        window.location.href = 'app.html';
      } catch (error) {
        console.error(error);
        errorMsg.innerText = 'E-mail ou palavra-passe incorretos. Verifique os dados.';
        errorMsg.classList.remove('hidden');
        btnText.innerText = 'Entrar no Sistema';
        btnLoader.classList.add('hidden');
      }
    };
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f9f8fa',
              100: '#f2eff5',
              200: '#e3dce8',
              300: '#cca3c0',
              400: '#b8a5c2',
              500: '#a695b1',
              600: '#8c7899',
              700: '#73607f',
              800: '#5c4c66',
              900: '#483a50',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fdfbfc;
      color: #332d38;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-brand-200 selection:text-brand-900">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-brand-100 p-8 space-y-6">
    
    <!-- Cabeçalho do Login -->
    <div class="text-center space-y-2">
    <div class="w-48 h-24 mx-auto rounded-2xl bg-brand-FFF text-white flex items-center justify-center shrink-0">
          <img src="logoTati.png"/>
      </div> 	  
      <h1 class="text-2xl font-bold tracking-tight text-brand-900">Tatiane Pannocchia Sartorelli</h1>
      <p class="text-xs text-brand-700/70 uppercase tracking-widest font-semibold">Advocacia</p>
    </div>

    <!-- Mensagem de Erro -->
    <div id="errorMessage" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-xs text-center font-medium"></div>

    <!-- Formulário de Acesso -->
    <form onsubmit="handleLogin(event)" class="space-y-4 text-xs sm:text-sm">
      <div>
        <label class="block font-medium text-brand-800 mb-1">E-mail</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-brand-400">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </span>
          <input type="email" id="loginEmail" required placeholder="exemplo@advocacia.com" class="w-full pl-10 pr-4 py-2.5 bg-brand-50/30 border border-brand-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/30">
        </div>
      </div>

      <div>
        <label class="block font-medium text-brand-800 mb-1">Senha</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-brand-400">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input type="password" id="loginSenha" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-brand-50/30 border border-brand-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/30">
        </div>
      </div>

      <button type="submit" class="w-full mt-2 py-3 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-medium text-sm shadow-md shadow-brand-500/25 transition-all flex items-center justify-center space-x-2">
        <span id="btnText">Entrar no Sistema</span>
        <div id="btnLoader" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      </button>
    </form>

    <div class="text-center pt-2 border-t border-brand-100">
      <p class="text-[11px] text-brand-400">Acesso restrito a profissionais autorizados.</p>
    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>

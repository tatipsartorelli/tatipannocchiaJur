<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPS | Acesso ao Sistema</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs (Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyASwLb54IjFjpYoqVacuoVuOj_5LPPTrew",
      authDomain: "tatipannocchiajur.firebaseapp.com",
      projectId: "tatipannocchiajur",
      storageBucket: "tatipannocchiajur.firebasestorage.app",
      messagingSenderId: "442550623929",
      appId: "1:442550623929:web:361c33d8af02e055a0c568",
      measurementId: "G-E9XPJ50325"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleLogin = async function(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const senha = document.getElementById('loginSenha').value;
      const errorMsg = document.getElementById('errorMessage');
      const btnText = document.getElementById('btnText');
      const btnLoader = document.getElementById('btnLoader');

      try {
        errorMsg.classList.add('hidden');
        btnText.innerText = 'A entrar...';
        btnLoader.classList.remove('hidden');

        // Autenticar com o Firebase Auth
        await signInWithEmailAndPassword(auth, email, senha);

        // Sucesso: Redireciona para o painel principal (app.html)
        window.location.href = 'app.html';
      } catch (error) {
        console.error(error);
        errorMsg.innerText = 'E-mail ou palavra-passe incorretos. Verifique os dados.';
        errorMsg.classList.remove('hidden');
        btnText.innerText = 'Entrar no Sistema';
        btnLoader.classList.add('hidden');
      }
    };
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f9f8fa',
              100: '#f2eff5',
              200: '#e3dce8',
              300: '#cca3c0',
              400: '#b8a5c2',
              500: '#a695b1',
              600: '#8c7899',
              700: '#73607f',
              800: '#5c4c66',
              900: '#483a50',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      color-scheme: light;
      --purple-deep: #211238;
      --purple-mid: #513078;
      --purple-light: #9b79c7;
      --lavender: #e9ddf7;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      color: #332744;
      background:
        radial-gradient(ellipse at 14% 18%, rgba(202, 164, 255, .34), transparent 34%),
        radial-gradient(ellipse at 88% 82%, rgba(123, 77, 174, .34), transparent 38%),
        linear-gradient(135deg, #211238 0%, #392052 34%, #65418a 68%, #302044 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 22rem;
      height: 22rem;
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none;
      opacity: .42;
      z-index: 0;
    }

    body::before {
      top: -9rem;
      right: -7rem;
      background: radial-gradient(circle, rgba(224, 199, 255, .48), transparent 68%);
    }

    body::after {
      bottom: -11rem;
      left: -8rem;
      background: radial-gradient(circle, rgba(157, 112, 207, .55), transparent 70%);
    }

    .login-card {
      position: relative;
      z-index: 1;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(255,255,255,.86), rgba(248,242,255,.72));
      border: 1px solid rgba(255,255,255,.58);
      box-shadow:
        0 28px 80px rgba(17, 7, 31, .34),
        0 8px 24px rgba(27, 12, 45, .16),
        inset 0 1px 0 rgba(255,255,255,.8);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 5px;
      background: linear-gradient(90deg, #b99add, #7751a0, #d5b9f3);
    }

    .login-input {
      background: rgba(255,255,255,.66) !important;
      border-color: rgba(126, 91, 160, .24) !important;
      color: #342345;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .login-input::placeholder { color: #a79ab4; }

    .login-input:focus {
      background: rgba(255,255,255,.94) !important;
      border-color: #9270bb !important;
      box-shadow: 0 0 0 4px rgba(146,112,187,.16);
    }

    .login-button {
      background: linear-gradient(110deg, #67428e, #8057a9 55%, #68438e);
      box-shadow: 0 9px 22px rgba(91, 55, 130, .28), inset 0 1px 0 rgba(255,255,255,.22);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .login-button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 13px 28px rgba(91, 55, 130, .34);
    }

    .login-button:active { transform: translateY(0); }

    @media (max-width: 480px) {
      body { padding: 1rem; }
      .login-card { padding: 1.65rem; border-radius: 1.5rem; }
      .login-title { font-size: 1.25rem; line-height: 1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-brand-200 selection:text-brand-900">

  <div class="login-card w-full max-w-md rounded-3xl p-8 space-y-6">
    
    <!-- Cabeçalho do Login -->
    <div class="text-center space-y-2">
 <!--      <div class="w-16 h-16 mx-auto rounded-2xl bg-brand-500 text-white flex items-center justify-center shadow-lg shadow-brand-500/25">
        <i data-lucide="scale" class="w-8 h-8"></i>
      </div>
-->	  
	  
      <div class="w-48 h-24 mx-auto rounded-2xl bg-brand-FFF text-white flex items-center justify-center shrink-0">
          <img src="logoTati.png"/>
      </div> 	  
      <h1 class="login-title text-2xl font-bold tracking-tight text-brand-900">Tatiane Pannocchia Sartorelli</h1>
      <p class="text-xs text-brand-700/70 uppercase tracking-widest font-semibold">Advocacia</p>
    </div>

    <!-- Mensagem de Erro -->
    <div id="errorMessage" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-xs text-center font-medium"></div>

    <!-- Formulário de Acesso -->
    <form onsubmit="handleLogin(event)" class="space-y-4 text-xs sm:text-sm">
      <div>
        <label class="block font-medium text-brand-800 mb-1">E-mail</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-brand-400">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </span>
          <input type="email" id="loginEmail" required placeholder="exemplo@advocacia.com" class="login-input w-full pl-10 pr-4 py-3 border rounded-xl focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block font-medium text-brand-800 mb-1">Senha</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-brand-400">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input type="password" id="loginSenha" required placeholder="••••••••" class="login-input w-full pl-10 pr-4 py-3 border rounded-xl focus:outline-none">
        </div>
      </div>

      <button type="submit" class="login-button w-full mt-2 py-3.5 rounded-xl text-white font-semibold text-sm transition-all flex items-center justify-center space-x-2">
        <span id="btnText">Entrar no Sistema</span>
        <div id="btnLoader" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      </button>
    </form>

    <div class="text-center pt-2 border-t border-brand-100">
      <p class="text-[11px] text-brand-400">Acesso restrito a profissionais autorizados.</p>
    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
